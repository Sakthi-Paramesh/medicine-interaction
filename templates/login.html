{% load static %}
<!DOCTYPE html>
<html lang="en" >
{% include 'fragments/header.html' with title='Login' %}
<body class="d-flex flex-column">

    {% include 'fragments/navbar.html' %}

    <main class="page-content d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="glass-card p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Welcome Back</h2>
                            <p class="text-muted-custom">Sign in to access your dashboard</p>
                        </div>
                        
                        <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label text-muted-custom fw-medium">Username</label>
                                <input type="text" class="form-control-custom w-100" id="username" name="username" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label text-muted-custom fw-medium">Password</label>
                                <input type="password" class="form-control-custom w-100" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary-custom w-100 mb-3" id="loginBtn">
                                Sign In
                            </button>
                        </form>
                        
                        <p class="text-center mt-3 text-muted-custom mb-0">
                            Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none text-primary fw-medium">Sign up</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    {% include 'fragments/footer.html' %}

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing in...';
            btn.disabled = true;

            const data = {
                username: this.username.value,
                password: this.password.value
            };

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = '/dashboard';
                } else {
                    return response.text().then(text => { throw new Error(text) });
                }
            })
            .catch(error => {
                const alert = document.getElementById('error-alert');
                alert.textContent = error.message;
                alert.classList.remove('d-none');
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
