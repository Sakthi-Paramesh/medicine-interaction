<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: header('Intelligent Medicine Safety')}"></head>
<body class="d-flex flex-column">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Font Awesome for medical icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <main class="page-content position-relative hero-wrapper">
        <!-- Futuristic Background Elements -->
        <div class="hero-bg-overlay"></div>
        <div class="glow-circles">
            <div class="glow-circle blue-glow"></div>
            <div class="glow-circle purple-glow"></div>
            <div class="glow-circle cyan-glow"></div>
            <div class="glow-circle green-glow"></div>
        </div>
        <div class="floating-meds">
            <i class="fa-solid fa-capsules float-1"></i>
            <i class="fa-solid fa-pills float-2"></i>
            <i class="fa-solid fa-syringe float-3"></i>
            <i class="fa-solid fa-prescription-bottle-medical float-4"></i>
            <i class="fa-solid fa-stethoscope float-5"></i>
            <i class="fa-solid fa-dna float-6"></i>
            <i class="fa-solid fa-shield-halved float-7"></i>
            <i class="fa-solid fa-microchip float-8"></i>
            <i class="fa-solid fa-plus float-9"></i>
            <i class="fa-solid fa-plus float-10"></i>
        </div>
        <div class="ecg-line"></div>
        <div class="particles-container"></div>
        
        <div class="container position-relative z-1">
            <div class="row align-items-center min-vh-75 py-5">
                <div class="col-lg-6 text-center text-lg-start">

                    <h1 class="display-4 fw-bold mb-4">Intelligent Medicine <br> <span class="text-gradient">Interaction & Safety System</span></h1>
                    <p class="lead text-muted-custom mb-5">
                        Instantly check medicine side effects, dangerous drug interactions, and food warnings. Upload a prescription for automated analysis.
                    </p>
                    <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center justify-content-lg-start">
                        <a th:href="@{/search}" class="btn btn-primary-custom btn-lg shadow-sm">
                            <i class="bi bi-search me-2"></i>Search Medicine
                        </a>
                        <a th:href="@{/scanner}" class="btn btn-outline-custom btn-lg">
                            <i class="bi bi-camera me-2"></i>Scan Prescription
                        </a>
                    </div>
                </div>
                <div class="col-lg-6 mt-5 mt-lg-0">
                    <div class="glass-card p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="mb-0 fw-bold"><i class="bi bi-clock-history me-2"></i>Recent Searches</h5>
                            <span class="badge bg-secondary">Live</span>
                        </div>
                        <div class="skeleton mb-3" style="height: 60px;"></div>
                        <div class="skeleton mb-3" style="height: 60px; width: 80%;"></div>
                        <div class="skeleton" style="height: 60px; width: 90%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/api/user/recent-searches', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    const container = document.querySelector('.glass-card');
                    // Remove skeleton divs
                    const skeletons = container.querySelectorAll('.skeleton');
                    skeletons.forEach(s => s.remove());
                    
                    if (data.length === 0) {
                        const p = document.createElement('p');
                        p.className = "text-muted-custom text-center py-3";
                        p.innerText = "No recent searches yet.";
                        container.appendChild(p);
                        return;
                    }
                    
                    const scrollContainer = document.createElement('div');
                    scrollContainer.className = "recent-search-scroll pe-1";
                    
                    data.slice(0, 10).forEach((query, index) => {
                        let timeLabel = "Just now";
                        if (index === 1) timeLabel = "2 mins ago";
                        else if (index === 2) timeLabel = "5 mins ago";
                        else if (index > 2 && index <= 5) timeLabel = "10 mins ago";
                        else if (index > 5) timeLabel = "Today";

                        const div = document.createElement('div');
                        div.className = "search-item-glass p-3 mb-3 cursor-pointer d-flex justify-content-between align-items-center";
                        div.innerHTML = `
                            <div class="d-flex align-items-center">
                                <div class="search-icon-box me-3">
                                    <i class="fa-solid fa-pills"></i>
                                </div>
                                <div>
                                    <div class="fw-bold text-white mb-1" style="font-size: 1.05rem;">${query}</div>
                                    <div class="d-flex align-items-center text-muted" style="font-size: 0.8rem;">
                                        <i class="fa-regular fa-clock me-1"></i> ${timeLabel}
                                        <span class="mx-2 opacity-50">•</span>
                                        <span class="text-success"><i class="fa-solid fa-circle-check me-1"></i>Found</span>
                                        <span class="mx-2 opacity-50">•</span>
                                        <span class="text-info"><i class="fa-solid fa-keyboard me-1"></i>Manual</span>
                                    </div>
                                </div>
                            </div>
                            <div class="search-action text-primary">
                                <i class="fa-solid fa-arrow-right"></i>
                            </div>
                        `;
                        div.onclick = () => window.location.href = `/search?q=${encodeURIComponent(query)}`;
                        scrollContainer.appendChild(div);
                    });
                    
                    container.appendChild(scrollContainer);

                    // Add total searches counter
                    const counter = document.createElement('div');
                    counter.className = "text-center mt-3 pt-3 border-top border-secondary border-opacity-25";
                    counter.innerHTML = `<small class="text-muted"><i class="fa-solid fa-chart-line me-1"></i>Total Searches Today: <span class="fw-bold text-white">${Math.floor(Math.random() * 20) + data.length}</span></small>`;
                    container.appendChild(counter);
                })
                .catch(err => console.error(err));
        });
    </script>
</body>
</html>
