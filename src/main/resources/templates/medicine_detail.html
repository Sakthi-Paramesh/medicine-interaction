<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Medicine Details')}"></head>
<body class="d-flex flex-column">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="page-content py-4">
        <div class="container" id="medicineContainer">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const medicineId = /*[[${medicineId}]]*/ 0;
        /*]]>*/
        
        document.addEventListener('DOMContentLoaded', () => {
            fetch(`/api/medicines/${medicineId}`)
                .then(response => {
                    if (!response.ok) throw new Error('Medicine not found');
                    return response.json();
                })
                .then(data => renderMedicine(data))
                .catch(error => {
                    document.getElementById('medicineContainer').innerHTML = `
                        <div class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i> ${error.message}
                        </div>
                        <a href="/search" class="btn btn-primary">Back to Search</a>
                    `;
                });
        });

        function renderMedicine(med) {
            const container = document.getElementById('medicineContainer');
            
            const prescBadge = med.prescriptionRequired 
                ? '<span class="badge bg-danger mb-2"><i class="bi bi-file-medical"></i> Prescription Required</span>'
                : '<span class="badge bg-success mb-2"><i class="bi bi-check-circle"></i> Over the Counter (OTC)</span>';

            container.innerHTML = `
                <div class="row mb-4">
                    <div class="col-md-8">
                        ${prescBadge}
                        <h1 class="display-5 fw-bold mb-1">${med.medicineName || 'N/A'}</h1>
                        <p class="lead text-muted mb-3">${med.genericName || 'N/A'} • ${med.brandName || 'N/A'}</p>
                        <span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 py-2 px-3 rounded-pill">
                            ${med.category || 'General'}
                        </span>
                    </div>
                    <div class="col-md-4 text-md-end mt-3 mt-md-0 d-print-none">
                        <button id="saveBtn" class="btn btn-outline-custom me-2" onclick="toggleSave()"><i class="bi bi-bookmark"></i> Save</button>
                        <button class="btn btn-outline-custom" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
                        <div class="mt-3 text-muted-custom small">
                            <strong>Manufacturer:</strong> ${med.manufacturer || 'Unknown'}
                        </div>
                    </div>
                </div>
                
                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="glass-card p-4 mb-4">
                            <h4 class="fw-bold mb-3 border-bottom pb-2 text-primary"><i class="fa-solid fa-stethoscope me-2"></i>Uses</h4>
                            <p class="mb-0 text-white" style="font-size: 1.05rem;">${med.uses || 'No data available.'}</p>
                        </div>

                        <div class="glass-card p-4 mb-4">
                            <h4 class="fw-bold mb-3 border-bottom pb-2 text-info"><i class="fa-solid fa-head-side-cough me-2"></i>Targeted Symptoms</h4>
                            <div class="d-flex flex-wrap gap-2 mt-2">
                                ${(med.symptoms || 'General conditions').split(',').map(s => 
                                    `<span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-3 py-2 rounded-pill shadow-sm"><i class="fa-solid fa-virus me-1"></i> ${s.trim()}</span>`
                                ).join('')}
                            </div>
                        </div>
                        
                        <div class="glass-card p-4 mb-4">
                            <h4 class="fw-bold mb-3 border-bottom pb-2 text-warning"><i class="bi bi-exclamation-triangle me-2"></i>Side Effects</h4>
                            <div class="row">
                                <div class="col-md-6">
                                    <h6 class="fw-bold">Common</h6>
                                    <p class="text-muted-custom">${med.commonSideEffects || 'None reported.'}</p>
                                </div>
                                <div class="col-md-6">
                                    <h6 class="fw-bold text-danger">Serious (Seek immediate help)</h6>
                                    <p class="text-muted-custom">${med.seriousSideEffects || 'None reported.'}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="glass-card p-4 mb-4">
                            <h4 class="fw-bold mb-3 border-bottom pb-2">Dosage & Instructions</h4>
                            <p><strong>Standard Dosage:</strong> ${med.dosage || 'Consult your doctor.'}</p>
                            <p><strong>Missed Dose:</strong> ${med.missedDoseInstructions || 'Take it as soon as you remember.'}</p>
                            <p><strong>Storage:</strong> ${med.storageInstructions || 'Store at room temperature.'}</p>
                        </div>
                    </div>
                    
                    <div class="col-lg-4">
                        <div class="glass-card p-4 mb-4 bg-danger bg-opacity-10 border-danger border-opacity-25">
                            <h5 class="fw-bold text-danger mb-3"><i class="bi bi-shield-x me-2"></i>Safety Warnings</h5>
                            <ul class="list-unstyled mb-0">
                                <li class="mb-3"><strong><i class="bi bi-cup-straw me-2"></i>Alcohol:</strong><br><span class="text-muted-custom small">${med.alcoholWarning || 'Consult doctor.'}</span></li>
                                <li class="mb-3"><strong><i class="bi bi-person-hearts me-2"></i>Pregnancy:</strong><br><span class="text-muted-custom small">${med.pregnancySafety || 'Consult doctor.'}</span></li>
                                <li class="mb-3"><strong><i class="bi bi-car-front me-2"></i>Driving:</strong><br><span class="text-muted-custom small">${med.drivingWarning || 'Consult doctor.'}</span></li>
                                <li class="mb-0"><strong><i class="bi bi-heart me-2"></i>Kidney/Liver:</strong><br><span class="text-muted-custom small">${med.kidneyWarning || ''} ${med.liverWarning || ''}</span></li>
                            </ul>
                        </div>
                        
                        <div class="glass-card p-4 mb-4">
                            <h5 class="fw-bold mb-3"><i class="bi bi-apple me-2"></i>Diet & Food</h5>
                            <p class="small mb-2"><strong>To Eat:</strong> ${med.foodToEat || 'No special diet.'}</p>
                            <p class="small mb-0 text-danger"><strong>To Avoid:</strong> ${med.foodToAvoid || 'None known.'}</p>
                        </div>
                    </div>
                </div>
            `;
            checkSaveStatus();
        }

        let isSaved = false;

        function checkSaveStatus() {
            fetch(`/api/user/save/status/${medicineId}`, { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    isSaved = data.saved;
                    updateSaveButton();
                });
        }

        function updateSaveButton() {
            const btn = document.getElementById('saveBtn');
            if (isSaved) {
                btn.classList.remove('btn-outline-custom');
                btn.classList.add('btn-primary-custom');
                btn.innerHTML = '<i class="bi bi-bookmark-fill"></i> Saved';
            } else {
                btn.classList.remove('btn-primary-custom');
                btn.classList.add('btn-outline-custom');
                btn.innerHTML = '<i class="bi bi-bookmark"></i> Save';
            }
        }

        function toggleSave() {
            const method = isSaved ? 'DELETE' : 'POST';
            fetch(`/api/user/save/${medicineId}`, { method: method, credentials: 'same-origin' })
                .then(res => {
                    if (res.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    return res.json();
                })
                .then(data => {
                    if (data) {
                        isSaved = data.saved;
                        updateSaveButton();
                    }
                });
        }
    </script>
</body>
</html>
