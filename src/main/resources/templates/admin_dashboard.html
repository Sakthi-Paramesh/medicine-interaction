<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Admin Dashboard')}"></head>
<body class="d-flex flex-column">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="page-content">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">Admin <span class="text-primary">Dashboard</span></h2>
                <span class="badge bg-danger">Admin Mode</span>
            </div>

            <div class="row g-4 mb-5">
                <div class="col-md-3">
                    <div class="glass-card p-4 text-center">
                        <h6 class="text-muted-custom text-uppercase fw-bold">Total Users</h6>
                        <h3 class="fw-bold text-primary mb-0">1</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="glass-card p-4 text-center">
                        <h6 class="text-muted-custom text-uppercase fw-bold">Medicines</h6>
                        <h3 class="fw-bold text-success mb-0">0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="glass-card p-4 text-center">
                        <h6 class="text-muted-custom text-uppercase fw-bold">AI Requests</h6>
                        <h3 class="fw-bold text-warning mb-0">0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="glass-card p-4 text-center">
                        <h6 class="text-muted-custom text-uppercase fw-bold">Scans</h6>
                        <h3 class="fw-bold text-info mb-0">0</h3>
                    </div>
                </div>
            </div>

            <h4 class="fw-bold mb-3">Quick Actions</h4>
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="glass-card p-4 d-flex align-items-center justify-content-between">
                        <div>
                            <h5 class="fw-bold mb-1">Manage Medicines</h5>
                            <p class="text-muted-custom mb-0">Add, edit, or remove medicines from database</p>
                        </div>
                        <a href="#" class="btn btn-primary-custom">Manage</a>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="glass-card p-4 d-flex align-items-center justify-content-between">
                        <div>
                            <h5 class="fw-bold mb-1">User Management</h5>
                            <p class="text-muted-custom mb-0">View registered users and roles</p>
                        </div>
                        <a href="#" class="btn btn-outline-custom">View Users</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
