<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - HumanEase AI'">HumanEase AI</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-shield-plus text-primary me-2"></i>HumanEase AI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/search}">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/scanner}"><i class="bi bi-camera me-1"></i>Scanner</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}">Login</a>
                    </li>
                    <li class="nav-item ms-lg-2" sec:authorize="!isAuthenticated()">
                        <a class="btn btn-primary-custom" th:href="@{/register}">Sign Up</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item ms-lg-2" sec:authorize="isAuthenticated()">
                        <form th:action="@{/api/auth/logout}" method="post" class="d-inline" id="logoutForm">
                            <button type="button" onclick="logout()" class="btn btn-outline-custom">Logout</button>
                        </form>
                    </li>
                    <li class="nav-item ms-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="theme-toggle">
                            <label class="form-check-label" for="theme-toggle"><i class="bi bi-moon-stars"></i></label>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <script>
        function logout() {
            fetch('/api/auth/logout', { method: 'POST' })
            .then(response => {
                window.location.href = '/login?logout';
            });
        }
    </script>
</div>

<div th:fragment="footer" class="mt-auto py-4 text-center border-top">
    <div class="container">
        <p class="text-muted-custom mb-0">&copy; 2026 Sakthi Paramesh HumanEase. All rights reserved.</p>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/main.js}"></script>
</div>

</body>
</html>
